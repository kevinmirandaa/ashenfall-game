name: Deploy

# Corre tras un CI verde en main, o a mano. Solo actúa si el repositorio tiene las variables de Azure
# (ver docs/azure-setup.md); sin ellas los jobs se omiten y no ponen el repositorio en rojo.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      solo_prod:
        description: 'Saltar dev y desplegar solo prod (Azure for Students permite un entorno de Container Apps por región)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  dev:
    # Para cuidar el crédito, tras un merge solo despliega con AUTO_DEPLOY=true; a mano, siempre.
    if: vars.AZURE_CLIENT_ID != '' && ((github.event_name == 'workflow_dispatch' && !inputs.solo_prod) || (vars.AUTO_DEPLOY == 'true' && github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: dev
    permissions:
      id-token: write
      contents: read
    env:
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Desplegar dev
        run: |
          IMAGE_TAG="$(git rev-parse --short=12 HEAD)" scripts/deploy.sh dev

  prod:
    needs: dev
    # Con dev omitido solo corre si se pidió a mano solo_prod; así un CI verde sin AUTO_DEPLOY nunca llega a prod.
    if: always() && vars.AZURE_CLIENT_ID != '' && (needs.dev.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.solo_prod))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # El environment prod exige revisores: el job espera aprobación manual antes de empezar.
    environment: prod
    permissions:
      id-token: write
      contents: read
    env:
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Desplegar prod (revisión al 0 %, smoke test, traslado de tráfico y drenado)
        run: |
          IMAGE_TAG="$(git rev-parse --short=12 HEAD)" scripts/deploy.sh prod
