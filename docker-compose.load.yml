# Una réplica con recursos fijos, para que las cifras sean comparables. Uso:
# docker compose -f docker-compose.yml -f docker-compose.load.yml up -d --build --wait
services:
  server:
    cpus: 1
    mem_limit: 1g
    environment:
      # Los bots comparten IP: sin esto el límite por IP impediría generar la carga.
      RATE_LIMIT_GLOBAL_PER_MINUTE: "1000000"
      RATE_LIMIT_AUTH_PER_MINUTE: "1000000"
      RATE_LIMIT_LOGIN_PER_MINUTE: "1000000"
      LOG_LEVEL: warn
