# Solo para desarrollo local. Los puertos se publican únicamente en 127.0.0.1 y no se usan contraseñas,
# de modo que ninguna credencial entra al repositorio.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ashenfall
      POSTGRES_USER: ashenfall
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ashenfall -d ashenfall"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
