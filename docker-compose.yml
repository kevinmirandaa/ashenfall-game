# Solo para desarrollo local. Los puertos se publican únicamente en 127.0.0.1 y no se usan contraseñas,
# de modo que ninguna credencial entra al repositorio.
services:
  server:
    build: .
    environment:
      DATABASE_URL: postgres://ashenfall@postgres:5432/ashenfall
      REDIS_URL: redis://redis:6379
      # Genera una clave aleatoria al arrancar. Solo para local: en Azure llega desde Key Vault.
      ASHENFALL_DEV_SECRETS: "1"
      ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ashenfall
      POSTGRES_USER: ashenfall
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ashenfall -d ashenfall"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
